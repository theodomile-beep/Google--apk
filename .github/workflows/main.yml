name: Build APK with Docker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build APK with Docker
      run: |
        docker run --rm -v $(pwd):/home/user/hostcwd -w /home/user/hostcwd \
          -e ANDROID_SDK_ROOT=/home/user/.android \
          kivy/buildozer:latest \
          buildozer -v android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GooglePartnerSetup
        path: bin/*.apk
    
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
        tag_name: v1.0.${{ github.run_number }}
        name: Google Partner Setup v1.0.${{ github.run_number }}
        body: Google Partner Setup APK
